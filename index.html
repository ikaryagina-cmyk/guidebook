  --inv:#FFFFFF; --on-inv:#161616;
  --news-bg:#242424; --band:#242424;
  --ok:#6CC477; --ok-bg:#1D3521; --warn:#F0A84A; --warn-bg:#3A2A10; --draft:#B9B6B0; --draft-bg:#2E2E2E; --danger:#FF7A5C; --danger-bg:#3A1C14;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.45);
  --hero-img:var(--img-dark);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--fg2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .12s var(--ease)}
.press:active{transform:scale(.97)}

/* type */
.display{font:950 clamp(42px,11.5vw,72px)/.92 var(--font);letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
.display.sm{font-size:clamp(34px,9.4vw,56px)}
.eyebrow{font:800 12px/1.3 var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.h2{font:800 22px/1.15 var(--font)}
.lede{font:500 18px/1.45 var(--font);color:var(--fg2);max-width:60ch}

/* page */
.page{max-width:1120px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 120px);display:grid;gap:28px}
.page.narrow{max-width:760px}
.page.tools{padding-bottom:40px}
@media (min-width:900px){.page{padding-inline:32px;padding-top:28px}}
.block{display:grid;gap:14px;min-width:0}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{color:var(--link);font-weight:800;font-size:15px;background:none;border:0;padding:0;cursor:pointer}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.title-row .muted{font-weight:800;font-size:15px;padding-bottom:6px}

/* mode band */
.modebar{background:var(--band);color:var(--band-fg)}
.modebar.city{background:var(--pink);color:var(--on-pink);--band-line:rgba(255,255,255,.45)}
.modebar-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.modeseg{display:inline-flex;gap:2px;border:1px solid var(--band-line);border-radius:999px;padding:3px}
.modeseg button{border:0;background:transparent;color:inherit;padding:7px 14px;border-radius:999px;font:800 13px/1 var(--font);cursor:pointer;white-space:nowrap}
.modeseg button[aria-pressed="true"]{background:var(--pink);color:var(--on-pink)}
.modebar.city .modeseg button[aria-pressed="true"]{background:var(--on-pink);color:var(--pink-600)}
@media (min-width:900px){.modebar-in{padding-inline:32px}}

/* top bars */
.home-top{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:44px;height:44px}
.home-hi{display:grid;gap:2px;min-width:0}
.home-hi b{font:800 19px/1.15 var(--font)}
.topbar{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px}
.topbar-mid{text-align:center;color:var(--fg2);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:8px;justify-content:flex-end;min-width:48px}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:0;cursor:pointer;color:var(--fg);flex:none;box-shadow:var(--shadow-sm)}
.circle.on{background:var(--pink);color:var(--on-pink)}
.circle.on svg.i{fill:currentColor}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;font:800 12px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;background:var(--card);color:var(--fg);border:0;cursor:pointer;white-space:nowrap}
.chip.ink{background:var(--inv);color:var(--on-inv)}
.chip.line{background:transparent;border:1.5px solid var(--line)}
.tagchip{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font:800 15px/1 var(--font);cursor:pointer;color:var(--fg);white-space:nowrap}
.tagchip:hover{border-color:var(--pink)}
.tagchip.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.pill{display:inline-flex;align-items:center;gap:6px;font:800 11px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--x-bg);color:var(--x);white-space:nowrap}
.pill.ok{--x:var(--ok);--x-bg:var(--ok-bg)}
.pill.warn{--x:var(--warn);--x-bg:var(--warn-bg)}
.pill.draft{--x:var(--draft);--x-bg:var(--draft-bg)}
.pill.brand{--x:var(--on-pink);--x-bg:var(--pink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--pink);color:var(--on-pink);font:800 16px/1 var(--font);cursor:pointer;white-space:nowrap;transition:background .15s,transform .12s var(--ease)}
.btn:hover{background:var(--pink-600)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.ink{background:var(--inv);color:var(--on-inv)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--fg2)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.small{height:40px;padding:0 18px;font-size:14px}
.btn.wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* progress */
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--pink)}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .bar{flex:1}
.bar-row span{font:800 13px/1 var(--font);color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* home hero */
.hero{position:relative;border-radius:32px;padding:26px 22px 22px;background:var(--hero-img) center 62%/cover no-repeat,var(--bg);display:grid;gap:22px;overflow:hidden}
.hero-num{font:950 clamp(84px,24vw,128px)/.85 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-sub{font:600 17px/1.3 var(--font);margin-top:6px}
.hero-stat{display:grid;gap:6px}
.cont{background:var(--card);border-radius:24px;padding:18px 18px 20px;box-shadow:var(--shadow-md);display:grid;gap:14px;max-width:460px}
.cont-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.cont-title{font:800 19px/1.2 var(--font);margin-top:6px}
.cont-meta{font-size:15px;color:var(--fg2);margin-top:4px}
.go{width:52px;height:52px;border-radius:50%;background:var(--pink);color:var(--on-pink);display:grid;place-items:center}
@media (min-width:900px){.hero{grid-template-columns:1fr minmax(320px,440px);align-items:end;padding:40px}.hero .cont{justify-self:end;width:100%}}

/* department hero extras */
.hero-parts{font:600 15px/1.35 var(--font);color:var(--fg);max-width:34ch}
.cont-link{display:grid;gap:10px}
.tile-foot{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px}

/* news */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.hscroll{margin-inline:0;padding-inline:0}}
.news{flex:0 0 min(270px,78vw);min-height:200px;scroll-snap-align:start;border-radius:24px;padding:18px 20px;background:var(--img-dark) left top/280% auto no-repeat,var(--news-bg);color:var(--news-fg);display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.news:nth-child(2n){background-position:right 30%}
.news:nth-child(3n){background-position:60% 80%}
.news-title{font:800 19px/1.2 var(--font)}
.news-meta{font-size:14px;color:var(--news-fg2);margin-top:6px}
.news .pill{align-self:flex-start}

/* section tiles (home) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:24px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;min-height:168px;min-width:0}
.tile-num{font:950 42px/.85 var(--font);color:var(--pink);letter-spacing:-.02em}
.tile-title{font:800 16px/1.2 var(--font);flex:1;overflow-wrap:anywhere}

/* sections list */
.seclist{display:grid;gap:12px}
@media (min-width:900px){.seclist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.secrow{background:var(--card);border-radius:24px;padding:20px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px 14px;align-items:center}
.secrow-num{font:950 44px/.85 var(--font);color:var(--pink);letter-spacing:-.02em}
.secrow-body{display:grid;gap:6px;min-width:0}
.secrow-title{font:800 19px/1.2 var(--font)}
.secrow-note{color:var(--fg2);font-size:15px}
.secrow-subs{font-size:14px;color:var(--fg2)}
.secrow-subs b{font-weight:800;color:var(--fg)}
.secrow .bar-row{margin-top:6px}

/* guide cards */
.glist{display:grid;gap:10px}
.gcard{background:var(--card);border-radius:24px;padding:16px 18px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start}
.gmark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--font);box-shadow:inset 0 0 0 2px var(--line);color:var(--fg2)}
.gmark.done{background:var(--ok);color:var(--on-pink);box-shadow:none}
.gmark.done svg.i{width:18px;height:18px;stroke-width:3}
.gmark.saved{background:transparent;box-shadow:none;color:var(--pink)}
.gmark.saved svg.i{fill:currentColor}
.gbody{display:grid;gap:5px;min-width:0}
.gtitle{font:800 17px/1.25 var(--font)}
.gsum{font-size:15px;color:var(--fg2)}
.gmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--fg2)}
.todo{display:flex;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.35}
.todo b{flex:none;font:800 11px/1.5 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.todo-box{background:var(--warn-bg);border-radius:18px;padding:12px 16px}
.srclink{display:inline-flex;align-items:center;gap:8px;justify-self:start;font:700 14px/1.2 var(--font);color:var(--link);text-decoration:underline;text-underline-offset:3px}
.srclink svg.i{width:18px;height:18px}
.subsec{display:grid;gap:12px;margin-top:10px}
.subsec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.subsec-head .h2 span{color:var(--pink);margin-right:10px}

/* guide page */
.readbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:4px;z-index:45;background:transparent;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:var(--pink);border-radius:0 4px 4px 0}
.g-head{display:grid;gap:16px}
.g-title{font:950 clamp(38px,10.5vw,64px)/.92 var(--font);letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
.g-meta{font-size:15px;color:var(--fg2)}
.toc{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
@media (min-width:900px){.toc{margin-inline:0;padding-inline:0;flex-wrap:wrap}}
.toc button{flex:none;height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--card);font:800 14px/1 var(--font);cursor:pointer;white-space:nowrap;color:var(--fg)}
.toc button:hover{background:var(--inv);color:var(--on-inv)}
.hl-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--fg2)}

/* prose */
.prose{font:500 17px/1.55 var(--font);overflow-wrap:break-word;min-width:0}
.prose > *{margin:0 0 14px}
.prose > :last-child{margin-bottom:0}
.prose h2{font:800 23px/1.2 var(--font);margin:30px 0 12px;scroll-margin-top:24px}
.prose h3{font:800 19px/1.25 var(--font);margin:24px 0 8px;scroll-margin-top:24px}
.prose ul,.prose ol{padding-left:24px}
.prose li{margin:6px 0}
.prose li::marker{color:var(--pink);font-weight:800}
.prose a{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.prose strong{font-weight:800}
.prose code{font:600 .9em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);padding:2px 6px;border-radius:6px}
.prose hr{border:0;border-top:1.5px solid var(--line);margin:28px 0}
.prose img{max-width:100%;height:auto;border-radius:18px;vertical-align:middle}
.fig{margin:20px 0!important;display:grid;gap:8px}
.fig a{display:block;text-decoration:none!important}
.fig img{display:block;width:100%;height:auto;border-radius:20px;background:var(--card)}
.fig figcaption{font-size:14px;line-height:1.4;color:var(--fg2);text-align:center}
.img-missing{display:grid;place-items:center;min-height:120px;border-radius:20px;background:var(--card);color:var(--fg2);font-size:14px;font-weight:600;margin:16px 0}
.table-wrap{overflow-x:auto;background:var(--card);border-radius:20px}
.prose table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
.prose th,.prose td{text-align:left;padding:12px 16px;border-bottom:1.5px solid var(--bg);vertical-align:top}
.prose th{font-weight:800}
.prose tr:last-child td{border-bottom:0}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:6px;padding:0 3px}
.callout{background:var(--pink);color:var(--on-pink);border-radius:24px;padding:18px 20px;margin:20px 0!important}
.callout > *{margin:0 0 8px}
.callout > :last-child{margin-bottom:0}
.callout a{color:var(--on-pink)}
.callout-label{display:block;font:800 12px/1.3 var(--font);letter-spacing:.04em;text-transform:uppercase;opacity:.9;margin-bottom:8px}
.checklist{background:var(--card);border-radius:24px;padding:16px 18px 10px;margin:18px 0!important}
.cl-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.cl-head b{font:800 12px/1.3 var(--font);color:var(--pink);letter-spacing:.04em;text-transform:uppercase}
.cl-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer;font:500 16px/1.4 var(--font);color:var(--fg)}
.cl-box{flex:none;width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--fg);display:grid;place-items:center;margin-top:-2px}
.cl-box svg{width:16px;height:16px;fill:none;stroke:var(--on-pink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cl-item[aria-pressed="true"] .cl-box{background:var(--pink);box-shadow:none}
.cl-item[aria-pressed="true"] .cl-box svg{opacity:1}
.att{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;background:var(--card);margin:14px 0;text-decoration:none!important;color:var(--fg)!important}
.att-icon{flex:none;width:52px;height:52px;border-radius:16px;background:var(--pink);color:var(--on-pink);display:grid;place-items:center}
.att-icon svg{width:20px;height:20px;fill:currentColor;margin-left:3px}
.att-text{display:grid;gap:2px;min-width:0}
.att-title{font:800 16px/1.25 var(--font);overflow-wrap:anywhere}
.att-host{font-size:14px;color:var(--fg2);font-weight:500}
.g-end{display:grid;gap:12px;margin-top:8px}
.next{background:var(--inv);color:var(--on-inv);border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.next .eyebrow{color:var(--on-inv);opacity:.65}
.next-title{font:800 18px/1.2 var(--font);margin-top:4px}

/* search */
.sbox{display:flex;align-items:center;gap:10px;height:60px;padding:0 10px 0 20px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.sbox:focus-within{box-shadow:inset 0 0 0 2px var(--pink)}
.sbox input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:600 18px/1 var(--font);color:var(--fg);outline:none}
.sbox input::placeholder{color:var(--fg3)}
.sbox input::-webkit-search-cancel-button{display:none}
.sclear{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.sclear svg.i{width:16px;height:16px;stroke-width:3}
.filter{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:0 16px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
@media (min-width:900px){.filter{margin-inline:0;padding-inline:0;flex-wrap:wrap}}
.res{display:grid;gap:10px}
.rcard{background:var(--card);border-radius:24px;padding:16px 20px;display:grid;gap:6px}
.rcard-title{font:800 18px/1.25 var(--font)}
.rcard-snip{font-size:15px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent{display:flex;flex-wrap:wrap;gap:8px}

/* empty states */
.empty{background:var(--card);border-radius:24px;padding:24px;display:grid;gap:10px;justify-items:start}
.empty p{color:var(--fg2)}

/* department hub */
.dept-grid{display:grid;gap:12px}
@media (min-width:700px){.dept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dept-grid .dcard.brand{grid-column:1/-1}}

/* cities & access */
.acc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.stat b{font:950 34px/.9 var(--font);color:var(--pink);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--fg2);font-weight:600}
.panel .inp{background:var(--bg)}
.panel .field,.panel .row2{width:100%}
.acc-card{background:var(--card);border-radius:24px;padding:18px;display:grid;gap:12px;min-width:0}
.acc-card.off{background:var(--soft)}
.acc-card.off .acc-name{color:var(--fg2)}
.acc-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.acc-name{font:800 20px/1.2 var(--font)}
.acc-meta{font-size:14px}
.people{display:grid;gap:8px}
.person{background:var(--bg);border-radius:18px;padding:10px 10px 10px 14px;display:grid;gap:4px;min-width:0}
.acc-card.off .person{background:var(--card)}
.person-top{display:flex;align-items:center;gap:2px;min-width:0}
.person-mail{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg2)}
.mail-x:hover{color:var(--fg);background:var(--card)}
.mail-x svg.i{width:17px;height:17px;stroke-width:2.4}
.scope-btn{display:flex;align-items:center;gap:6px;justify-self:start;max-width:100%;border:0;background:none;padding:2px 0;font:600 14px/1.3 var(--font);color:var(--link);cursor:pointer;text-align:left}
.scope-btn span{min-width:0}
.scope-btn svg.i{width:16px;height:16px;transition:transform .2s var(--ease)}
.scope-btn[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.scope-ed{display:grid;gap:10px;padding:10px 0 4px}
.scope-modes{display:flex;flex-wrap:wrap;gap:4px 18px}
.scope-tree{display:grid;gap:2px;background:var(--card);border-radius:16px;padding:8px 14px}
.acc-card.off .scope-tree{background:var(--bg)}
.ck{display:flex;gap:10px;align-items:center;font-size:15px;padding:5px 0;cursor:pointer}
.ck b{color:var(--pink);font-weight:800;margin-right:2px}
.ck.sub{padding-left:30px;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--pink);flex:none;margin:0;cursor:pointer}
.ck input:disabled{cursor:default}
.acc-add{display:flex;gap:8px;align-items:center}
.acc-add .inp{flex:1;min-width:0;background:var(--bg);min-height:44px;padding:8px 16px}
.acc-card.off .acc-add .inp{background:var(--card)}
.sbox.sm{height:52px;padding-left:18px}
.sbox.sm input{font-size:16px}
.dcard{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:8px;align-content:start;min-height:150px}
.dcard.brand{background:var(--pink);color:var(--on-pink)}
.dcard.brand .eyebrow{color:var(--on-pink);opacity:.85}
.dcard-title{font:800 22px/1.15 var(--font)}
.dcard-num{font:950 56px/.9 var(--font);color:var(--pink)}
.dcard p{color:var(--fg2);font-size:15px}
.dcard.brand p{color:var(--on-pink);opacity:.9}

/* panels & forms */
.panel{background:var(--card);border-radius:24px;padding:22px;display:grid;gap:12px;justify-items:start}
.panel p{color:var(--fg2);max-width:62ch}
.file{position:relative;display:inline-block}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.file:focus-within .btn{outline:2px solid var(--pink);outline-offset:3px}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;font-weight:600}
.note{background:var(--card);border-radius:20px;padding:14px 18px;font-size:15px}
.ed{display:grid;gap:22px}
.field{display:grid;gap:8px;min-width:0}
.field > label,.lbl{font:800 15px/1.2 var(--font)}
.hint{font-size:14px;color:var(--fg2)}
.inp{width:100%;min-height:52px;padding:12px 18px;border:0;border-radius:18px;background:var(--card);color:var(--fg);font:500 16px/1.45 var(--font);box-shadow:inset 0 0 0 1.5px transparent;outline:none}
.inp::placeholder{color:var(--fg3)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--pink)}
.inp.bad{box-shadow:inset 0 0 0 2px var(--danger)}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px}
.err{font-size:14px;color:var(--danger);font-weight:600}
.row2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-opt{position:relative;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg-opt span{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;background:var(--card);font:800 14px/1 var(--font)}
.seg-opt input:checked + span{background:var(--x-bg);color:var(--x);box-shadow:inset 0 0 0 2px var(--x)}
.seg-opt input:focus-visible + span{outline:2px solid var(--pink);outline-offset:3px}
.seg-opt.ok{--x:var(--ok);--x-bg:var(--ok-bg)}
.seg-opt.review{--x:var(--warn);--x-bg:var(--warn-bg)}
.seg-opt.draft{--x:var(--draft);--x-bg:var(--draft-bg)}
.body-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--card);border-radius:999px;padding:4px}
.tab-b{border:0;background:transparent;height:36px;padding:0 14px;border-radius:999px;font:800 13px/1 var(--font);cursor:pointer;color:var(--fg2)}
.tab-b[aria-selected="true"]{background:var(--inv);color:var(--on-inv)}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--card);border-radius:18px 18px 0 0;border-bottom:1.5px solid var(--bg)}
.tb button{border:0;background:transparent;height:36px;padding:0 12px;border-radius:999px;font:800 13px/1 var(--font);cursor:pointer;color:var(--fg)}
.tb button:hover{background:var(--bg)}
textarea.body{min-height:380px;border-radius:0 0 18px 18px;font:500 15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.preview{background:var(--soft);border-radius:24px;padding:22px}
.vrows{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr) auto} .vrow .v-url{grid-column:1/2;grid-row:2} .vrow .v-del{grid-row:1/3;grid-column:2}}
.actionbar{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.st-list{display:grid;gap:12px}
.st-row{background:var(--card);border-radius:24px;padding:16px;display:grid;gap:12px}
.st-row.sub{margin-left:24px;background:var(--soft)}
.st-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.st-num{flex:none;min-width:40px;font:950 22px/1 var(--font);color:var(--pink)}
.st-head .st-name{flex:1 1 200px;min-width:0;font-weight:800;background:var(--soft)}
.st-row.sub .st-name,.st-row.sub .inp{background:var(--card)}
.st-row .inp{background:var(--soft)}
.st-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--bg);cursor:pointer;color:var(--fg);flex:none}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.icon-btn svg.i{width:20px;height:20px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:40;width:min(460px,calc(100% - 32px));height:64px;border-radius:999px;background:var(--inv);display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-shadow:var(--shadow-md)}
.tabbtn{height:48px;min-width:48px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--on-inv);font:800 14px/1 var(--font);transition:background .2s var(--ease)}
.tabbtn .lbl{display:none}
.tabbtn.on{background:var(--pink);color:var(--on-pink);padding:0 18px}
.tabbtn.on .lbl{display:inline}

/* footer + toast */
.foot{max-width:1120px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 100px);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--fg2)}
.foot.tools{padding-bottom:24px}
@media (min-width:900px){.foot{padding-inline:32px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);flex:none}
.dot.shared{background:var(--ok)}
.dot.local{background:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:60;background:var(--inv);color:var(--on-inv);padding:14px 20px;border-radius:999px;font:700 15px/1.3 var(--font);box-shadow:var(--shadow-md);max-width:calc(100vw - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

  /* ---------- cities & access ---------- */
  // У каждого сотрудника свой набор разделов: sections = null значит «все разделы»,
  // массив id — только эти разделы (выбранный раздел открывает и все его подразделы).
  const EMAIL_G = /[^\s@,;:<>()"'\[\]]+@[^\s@,;:<>()"'\[\]]+\.[^\s@,;:<>()"'\[\].]+/g;
  const EMAIL_1 = /^[^\s@,;:<>()"'\[\]]+@[^\s@,;:<>()"'\[\]]+\.[^\s@,;:<>()"'\[\].]+$/;
  const uniq = a => Array.from(new Set(a));
  function peopleOf(c) {
    const list = Array.isArray(c.people) ? c.people.filter(p => p && p.email).map(p => ({ email: String(p.email).toLowerCase(), sections: Array.isArray(p.sections) ? p.sections.map(String) : null }))
      : (c.emails || []).map(e => ({ email: String(e).toLowerCase(), sections: null }));
    const seen = new Set(); return list.filter(p => !seen.has(p.email) && seen.add(p.email));
  }
  const accPeople = () => state.access.reduce((a, c) => a + peopleOf(c).length, 0);
  function splitEmails(text) {
    const tokens = String(text || '').split(/[\s,;]+/).map(t => t.trim().toLowerCase()).filter(Boolean);
    return { ok: uniq(tokens.filter(t => EMAIL_1.test(t))), bad: tokens.filter(t => !EMAIL_1.test(t)) };
  }
  function withEmails(people, emails) {
    const have = new Set(people.map(p => p.email));
    return people.concat(emails.filter(e => !have.has(e)).map(e => ({ email: e, sections: null })));
  }
  function scopeLabel(sections) {
    if (!Array.isArray(sections)) return 'все';
    const names = sections.map(id => TR.byId.get(id)).filter(Boolean).sort((a, b) => TR.idx.get(a.id) - TR.idx.get(b.id)).map(s => s.num + ' ' + s.name);
    return names.length ? names.join(', ') : 'не выбраны';
  }

  function accCSV() {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['Город', 'Почта', 'Разделы', 'Доступ']];
    state.access.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru')).forEach(c => {
      const st = c.active === false ? 'закрыт' : 'открыт';
      const people = peopleOf(c);
      if (!people.length) rows.push([c.name, '', '', st]);
      people.forEach(p => rows.push([c.name, p.email, scopeLabel(p.sections), st]));

    return '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
  }
  function cityByName(name) { const n = norm(name.trim()); return state.access.find(c => norm(c.name) === n); }
  function accError(id, msg) { const el = $(id); if (el) { el.textContent = msg; el.hidden = !msg; } }
  async function accWrite(fn) {
    if (state.busy) return false;
    state.busy = true;
    try { await fn(); return true; }
    catch (e) { handleWriteError(e); return false; }
    finally { state.busy = false; }
  }
  function cityBody(c, people) {
    people = people || peopleOf(c);
    return { name: c.name, people, emails: people.map(p => p.email), active: c.active !== false, createdAt: c.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(), updatedBy: state.me || null };
  }
  const newCityId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  async function accAddCity() {
    const name = $('#acc-name').value.trim();
    const em = splitEmails($('#acc-emails').value);
    if (!name) { accError('#acc-err', 'Напишите название города.'); $('#acc-name').focus(); return; }
    if (em.bad.length) { accError('#acc-err', 'Не похоже на почту: ' + em.bad.join(', ')); $('#acc-emails').focus(); return; }
    accError('#acc-err', '');
    const ex = cityByName(name);
    const ok = await accWrite(async () => {
      if (ex) await store.saveCity(ex.id, cityBody(ex, withEmails(peopleOf(ex), em.ok)));
      else await store.saveCity(newCityId(), cityBody({ name, active: true }, withEmails([], em.ok)));
    });
    if (!ok) return;
    $('#acc-name').value = ''; $('#acc-emails').value = '';
    toast(ex ? 'Город «' + ex.name + '» уже был, почты добавлены к нему' : 'Город «' + name + '» добавлен');

  async function accBulkAdd() {
    const lines = String($('#acc-bulk').value || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) { toast('Вставьте хотя бы одну строку: город и почты.'); return; }
    let added = 0, merged = 0, skipped = 0;
    const ok = await accWrite(async () => {
      for (const line of lines) {
        const emails = uniq((line.match(EMAIL_G) || []).map(e => e.toLowerCase()));
        const name = line.replace(EMAIL_G, ' ').replace(/[:;,\t|]+/g, ' ').replace(/\s+/g, ' ').trim();
        if (!name) { skipped++; continue; }
        const ex = cityByName(name);
        if (ex) { await store.saveCity(ex.id, cityBody(ex, withEmails(peopleOf(ex), emails))); merged++; }
        else { await store.saveCity(newCityId(), cityBody({ name, active: true }, withEmails([], emails))); added++; }
      }
    });
    if (!ok) { renderAccList(); return; }
    $('#acc-bulk').value = '';
    const parts = [];
    if (added) parts.push('добавлено ' + added + ' ' + plural(added, 'город', 'города', 'городов'));
    if (merged) parts.push('дополнено ' + merged);
    if (skipped) parts.push('пропущено строк без города: ' + skipped);
    toast(parts.length ? parts.join(', ').replace(/^./, s => s.toUpperCase()) : 'Ничего не добавлено');
    renderAccList();
  }
  async function accAction(kind, card, btn) {

      const inp = $('#acc-mail-' + c.id); const em = splitEmails(inp.value);
      if (!em.ok.length && !em.bad.length) { inp.focus(); return; }
      if (em.bad.length) { accError(errId, 'Не похоже на почту: ' + em.bad.join(', ')); inp.focus(); return; }
      const fresh = em.ok.filter(e => !people.some(p => p.email === e));
      if (!fresh.length) { accError(errId, 'Эта почта уже есть у города.'); return; }
      if (await accWrite(() => store.saveCity(c.id, cityBody(c, withEmails(people, fresh))))) { inp.value = ''; renderAccList(); }
    } else if (kind === 'rmmail') {
      const m = btn.dataset.mail;
      if (state.accEdit && state.accEdit.email === m) state.accEdit = null;
      if (await accWrite(() => store.saveCity(c.id, cityBody(c, people.filter(p => p.email !== m))))) { toast('Почта ' + m + ' удалена'); renderAccList(); }
    } else if (kind === 'scope') {
      const m = btn.dataset.mail;
      if (state.accEdit && state.accEdit.cid === c.id && state.accEdit.email === m) state.accEdit = null;
      else { const p = people.find(x => x.email === m); state.accEdit = { cid: c.id, email: m, all: !Array.isArray(p.sections), sel: new Set(Array.isArray(p.sections) ? p.sections : []) }; }
      renderAccList();

  function markStructDirty() { state.structDirty = true; const st = $('#stState'); if (st) st.textContent = 'Есть несохранённые изменения'; }
  function stAction(kind, id) {
    const list = state.struct; if (!list) return;
    const s = list.find(x => x.id === id); if (!s) return;
    if (kind === 'up' || kind === 'down') {
      const sibs = list.filter(x => (x.parent || '') === (s.parent || ''));
      const k = sibs.indexOf(s); const other = sibs[kind === 'up' ? k - 1 : k + 1]; if (!other) return;
      const a = list.indexOf(s), b = list.indexOf(other); list[a] = other; list[b] = s;
      state.structFocus = { id: s.id, el: kind };
    } else if (kind === 'addsub') {
      const n = { id: newSecId(), name: 'Новый подраздел', note: '', todo: '', parent: s.id };
      list.push(n); state.structFocus = { id: n.id, el: 'name' };
    } else if (kind === 'del') {
      if (guideCountIn(s.id) || list.some(x => x.parent === s.id)) return;
      list.splice(list.indexOf(s), 1);

    state.structDirty = true; render();
  }
  function bindStructure() {
    const box = $('#stList'); if (!box) return;
    box.addEventListener('input', e => {
      const el = e.target, f = el.dataset.f; if (!f || f === 'parent') return;
      const row = el.closest('[data-sid]'); const s = row && state.struct.find(x => x.id === row.dataset.sid); if (!s) return;
      s[f] = el.value; el.classList.remove('bad'); markStructDirty();
    });
    box.addEventListener('change', e => {
      const el = e.target; if (el.dataset.f !== 'parent') return;
      const row = el.closest('[data-sid]'); const list = state.struct;
      const i = list.findIndex(x => x.id === row.dataset.sid); if (i < 0) return;
      const s = list.splice(i, 1)[0]; s.parent = el.value; list.push(s);
      state.structDirty = true; state.structFocus = { id: s.id, el: 'parent' }; render();
    });
    const f = state.structFocus; state.structFocus = null;
    if (f) {
      const row = box.querySelector('[data-sid="' + f.id + '"]');
      const el = row && (f.el === 'name' ? row.querySelector('.st-name') : f.el === 'parent' ? row.querySelector('select') : row.querySelector('[data-st="' + f.el + '"]:not([disabled])') || row.querySelector('.st-name'));

      const v = String($('#lg-email').value || '').trim().toLowerCase();
      LOGIN.email = v;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { LOGIN.err = 'Похоже, в почте опечатка.'; renderLogin(); return; }
      LOGIN.err = ''; LOGIN.busy = true; renderLogin();
      let kind;
      try { kind = await sb.auth.kind(v); } catch (e) { LOGIN.busy = false; LOGIN.err = loginError(e); renderLogin(); return; }
      LOGIN.busy = false;
      if (kind === 'editor') { LOGIN.step = 'password'; renderLogin(); return; }
      if (kind === 'editor_new') { LOGIN.step = 'invite'; renderLogin(); return; }
      if (kind === 'city') { storeCity(v); boot(); return; }
      LOGIN.err = kind === 'closed' ? CLOSED : NO_EMAIL; renderLogin();
    } else if (f.id === 'inviteForm') {
      ev.preventDefault(); if (LOGIN.busy) return;
      const code = String($('#lg-code').value || '').replace(/\s+/g, '').toUpperCase();
      const p1 = String($('#lg-new').value || ''), p2 = String($('#lg-new2').value || '');
      const stop = m => { LOGIN.busy = false; LOGIN.err = m; renderLogin(); };
      if (!code) return stop('Введите код приглашения.');
      if (p1.length < 6) return stop('Пароль должен быть не короче 6 символов.');
      if (p1 !== p2) return stop('Пароли не совпадают.');
      LOGIN.err = ''; LOGIN.busy = true; renderLogin();
      try {
        const ok = await sb.rpc('check_invite', { addr: LOGIN.email, code });
        if (!ok) return stop('Код не подошёл. Проверьте его или попросите редактора выдать новый.');
        let sess = null;
        try { sess = await sb.auth.signUp(LOGIN.email, p1); }
        catch (e) {
          const ec = e && e.body && (e.body.error_code || e.body.code);
          if (ec !== 'user_already_exists' && ec !== 'email_exists') throw e;
          try { sess = await sb.auth.signInPassword(LOGIN.email, p1); }
          catch (e2) { return stop('Для этой почты уже есть аккаунт со старым паролем. Попросите редактора нажать «Новый код» в разделе Отдел → Редакторы.'); }
        }
        if (!sess) return stop('Пароль создан, но Supabase ждёт подтверждения почты. В настройках входа Supabase выключите Confirm email, потом попросите новый код.');
        const claimed = await sb.rpc('claim_editor', { code });
        if (!claimed) { await sb.auth.signOut(); return stop('Не получилось подтвердить приглашение. Попросите редактора выдать новый код.'); }
        LOGIN.busy = false; storeCity(''); boot();
      } catch (e) { stop(loginError(e)); }
    } else if (f.id === 'pwForm') {
      ev.preventDefault(); if (LOGIN.busy) return;
      const pw = String($('#lg-pw').value || '');
      if (!pw) { LOGIN.err = 'Введите пароль.'; renderLogin(); return; }
      LOGIN.err = ''; LOGIN.busy = true; renderLogin();
      try { await sb.auth.signInPassword(LOGIN.email, pw); LOGIN.busy = false; storeCity(''); boot(); }
      catch (e) { LOGIN.busy = false; LOGIN.err = loginError(e); renderLogin(); }
    }
  });
  document.addEventListener('click', async ev => {
    const b = ev.target.closest && ev.target.closest('button'); if (!b) return;
    if (b.id === 'lgOther') { LOGIN.step = 'email'; LOGIN.err = ''; renderLogin(); }
    else if (b.id === 'logoutBtn') { b.disabled = true; storeCity(''); await sb.auth.signOut(); location.hash = ''; location.reload(); }
    else if (b.id === 'lgRetry') { boot(); }
  });
  function renderOffline() {
    loginShell('Нет связи', '<div class="empty"><h2 class="h2">Не получилось связаться с базой гайдов</h2>' +
      '<p>Проверьте интернет и попробуйте ещё раз. Если не помогает, напишите в отдел франшиз.</p>' +
      '<div class="btn-row"><button class="btn small" type="button" id="lgRetry">Попробовать снова</button><button class="btn ghost small" type="button" id="logoutBtn">Выйти</button></div></div>');
  }
  function launch(who) {
    loginEmail = who.email;
    const rt = window.GBSupabase.runtime(sb, who);
    db = rt.db; user = rt.user; downloads = rt.downloads; assets = rt.assets;
    state.route = parseToken(location.hash);
    render();
    startShared();
  }
  async function boot() {
    const cfg = window.GB_CONFIG || {};
    if (!sb) sb = window.GBSupabase.create(cfg);
    const sess = await sb.auth.restore();
    if (sess) {
      let who;
      try { who = await sb.rpc('whoami'); }
      catch (e) {
        if (e && e.code === 'not_granted') { await sb.auth.signOut(); LOGIN.step = 'email'; LOGIN.err = 'Вход устарел. Войдите снова.'; renderLogin(); return; }
        renderOffline(); return;
      }
      if (who && who.editor) { launch({ email: who.email, editor: true }); return; }
      await sb.auth.signOut();
      LOGIN.step = 'email'; LOGIN.email = (who && who.email) || ''; LOGIN.err = 'Эту почту убрали из списка редакторов.'; renderLogin(); return;
    }
    const city = storedCity();
    if (city) {
      let kind;
      try { kind = await sb.auth.kind(city); } catch (e) { renderOffline(); return; }
      if (kind === 'city') { launch({ email: city, editor: false }); return; }
      storeCity('');
      LOGIN.email = city;
      if (kind === 'editor') { LOGIN.step = 'password'; renderLogin(); return; }
      LOGIN.err = kind === 'closed' ? CLOSED : NO_EMAIL;
    }
    LOGIN.step = 'email'; renderLogin();
  }

  /* ---------- редакторы ---------- */
  const ED = { list: null, loading: false, err: '', invite: null, confirm: null };
  const siteUrl = () => location.origin + location.pathname;
  const inviteText = (email, code) => 'Вас добавили в редакторы Гайдбука «Квиз, плиз!». Откройте ' + siteUrl() + ', войдите с почтой ' + email + ', введите код приглашения ' + code + ' и придумайте пароль.';
  function edErr(e) {
    const m = String((e && e.body && (e.body.message || e.body.msg)) || (e && e.message) || '');
    if (/bad_email/.test(m)) return 'Не похоже на почту.';
    if (/\bself\b/.test(m)) return 'Себя убрать или сбросить нельзя.';
    if (/not_editor/.test(m) || (e && e.code === 'not_granted')) return 'Это может только редактор. Обновите страницу и войдите снова.';
    if (e && e.code === 'unavailable') return 'Нет связи с базой. Проверьте интернет и попробуйте ещё раз.';
    return 'Не получилось. Попробуйте ещё раз.';
  }
  function viewEditors() {
    if (!editorMode()) return notFound('Раздел для отдела', 'Редакторами управляют только редакторы.');
    if (!sb) return notFound('Редакторы', 'Управлять редакторами можно на опубликованном сайте.');
    return '<div class="page narrow">' + topbar('dept', 'Отдел франшиз') +
      '<div class="g-head"><h1 class="display sm">Редакторы</h1><p class="lede">Редакторы правят гайды, разделы и доступы городов. Добавьте почту коллеги, и сайт выдаст код приглашения. Коллега откроет сайт, войдёт с этой почтой, введёт код и сам придумает пароль.</p></div>' +
      '<section class="panel"><h2 class="h2">Добавить редактора</h2><form class="login-box" id="edAddForm" novalidate>' +
      '<div class="field"><label for="ed-email">Почта</label><input class="inp" id="ed-email" type="email" inputmode="email" autocomplete="off" placeholder="name@quizplease.ru"></div>' +
      '<p class="err" id="ed-err" hidden></p><button class="btn small" type="submit" id="edAddBtn">Добавить и получить код</button></form>' +
      '<div id="edInvite">' + inviteHTML() + '</div></section>' +
      '<section class="panel"><h2 class="h2">Кто редактирует</h2><div id="edList">' + edListHTML() + '</div></section>' +
      '<section class="panel"><h2 class="h2">Сменить свой пароль</h2><form class="login-box" id="edPwForm" novalidate>' +
      '<input type="email" name="username" autocomplete="username" value="' + esc(loginEmail) + '" hidden>' +
      '<div class="field"><label for="ed-pw1">Новый пароль</label><input class="inp" id="ed-pw1" type="password" autocomplete="new-password" placeholder="Не короче 6 символов"></div>' +
      '<div class="field"><label for="ed-pw2">Пароль ещё раз</label><input class="inp" id="ed-pw2" type="password" autocomplete="new-password"></div>' +
      '<p class="err" id="ed-pw-err" hidden></p><button class="btn small ghost" type="submit">Сохранить пароль</button></form></section></div>';
  }
  function inviteHTML() {
    const iv = ED.invite; if (!iv) return '';
    return '<div class="invite-box"><p><b>' + esc(iv.title) + '</b></p>' + (iv.note ? '<p class="err">' + esc(iv.note) + '</p>' : '') +
      '<p class="invite-text" id="edInviteText">' + esc(inviteText(iv.email, iv.code)) + '</p>' +
      '<div class="btn-row"><button class="btn small" type="button" data-ed="copyinvite">Скопировать приглашение</button></div></div>';
  }
  function edListHTML() {
    if (ED.err) return '<p class="err">' + esc(ED.err) + '</p>';
    if (!ED.list) return '<p class="muted">Загружаю…</p>';
    if (!ED.list.length) return '<p class="muted">Редакторов пока нет.</p>';
    const meMail = String(loginEmail || '').toLowerCase();
    return ED.list.map(e => {
      const me = e.email === meMail, active = !!e.user_id;
      const pill = active ? '<span class="pill ok">Входит по паролю</span>' : '<span class="pill warn">Ждёт первого входа</span>';
      const conf = ED.confirm && ED.confirm.email === e.email ? ED.confirm.kind : '';
      let actions;
      if (me) actions = '<span class="muted">Это вы</span>';
      else if (conf === 'del') actions = '<span class="confirm">Убрать ' + esc(e.email) + ' из редакторов? <button class="btn danger small" type="button" data-ed="delyes">Да, убрать</button><button class="btn ghost small" type="button" data-ed="no">Нет</button></span>';
      else if (conf === 'reset') actions = '<span class="confirm">' + (active ? 'Старый пароль перестанет работать, коллега создаст новый по коду. ' : '') + 'Выдать новый код? <button class="btn small" type="button" data-ed="resetyes">Да, выдать</button><button class="btn ghost small" type="button" data-ed="no">Нет</button></span>';
      else actions = (!active && e.invite_code ? '<button class="btn small" type="button" data-ed="showinvite">Приглашение</button>' : '') +
        '<button class="btn ghost small" type="button" data-ed="reset">' + (active ? 'Сбросить пароль' : 'Новый код') + '</button>' +
        '<button class="btn danger small" type="button" data-ed="del">Убрать</button>';
      return '<div class="acc-card" data-edmail="' + esc(e.email) + '"><div class="acc-head"><span class="acc-name">' + esc(e.email) + '</span>' + pill + '</div>' +
        (!active && e.invite_code ? '<span class="muted acc-meta">Код приглашения: <b>' + esc(e.invite_code) + '</b></span>' : '') +
        '<div class="btn-row">' + actions + '</div></div>';
    }).join('');
  }
  function renderEdList() { const b = $('#edList'); if (b) b.innerHTML = edListHTML(); }
  function renderInvite() { const b = $('#edInvite'); if (b) b.innerHTML = inviteHTML(); }
  async function loadEditors() {
    if (!sb || ED.loading) return;
    ED.loading = true;
    try { ED.list = await sb.rows('editors', 'select=email,user_id,invite_code,added_at&order=added_at.asc'); ED.err = ''; }
    catch (e) { ED.err = edErr(e); ED.list = null; }
    ED.loading = false; renderEdList();
  }
  document.addEventListener('submit', async ev => {
    const f = ev.target;
    if (f.id === 'edAddForm') {
      ev.preventDefault();
      const inp = $('#ed-email'), er = $('#ed-err'), btn = $('#edAddBtn');
      const showErr = m => { er.textContent = m; er.hidden = !m; };
      const v = String(inp.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { showErr('Похоже, в почте опечатка.'); inp.focus(); return; }
      showErr(''); btn.disabled = true;
      try {
        const r = await sb.rpc('add_editor', { addr: v });
        if (r && r.status === 'active') showErr('Эта почта уже в редакторах и входит по паролю.');
        else { ED.invite = { email: v, code: r.code, title: 'Готово. Отправьте коллеге это приглашение:' }; inp.value = ''; renderInvite(); loadEditors(); }
      } catch (e) { showErr(edErr(e)); }
      btn.disabled = false;
    } else if (f.id === 'edPwForm') {
      ev.preventDefault();
      const p1 = String($('#ed-pw1').value || ''), p2 = String($('#ed-pw2').value || ''), er = $('#ed-pw-err');
      const showErr = m => { er.textContent = m; er.hidden = !m; };
      if (p1.length < 6) return showErr('Пароль должен быть не короче 6 символов.');
      if (p1 !== p2) return showErr('Пароли не совпадают.');
      showErr('');
      try { await sb.auth.updatePassword(p1); $('#ed-pw1').value = ''; $('#ed-pw2').value = ''; toast('Пароль сохранён'); }
      catch (e) {
        const ec = e && e.body && (e.body.error_code || e.body.code);
        showErr(ec === 'same_password' ? 'Это ваш текущий пароль. Придумайте другой.' : ec === 'weak_password' ? 'Пароль слишком простой.' : edErr(e));
      }
    }
  });
  document.addEventListener('click', async ev => {
    const b = ev.target.closest && ev.target.closest('[data-ed]'); if (!b) return;
    const card = b.closest('[data-edmail]'), email = card ? card.dataset.edmail : '', act = b.dataset.ed;
    if (act === 'copyinvite') { const t = $('#edInviteText'); copyText(t ? t.textContent : '').then(ok => toast(ok ? 'Приглашение скопировано' : 'Не получилось скопировать')); return; }
    if (act === 'showinvite') {
      const e = (ED.list || []).find(x => x.email === email);
      if (e && e.invite_code) { ED.invite = { email, code: e.invite_code, title: 'Приглашение для ' + email + ':' }; renderInvite(); const box = $('#edInvite'); if (box) box.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); }
      return;
    }
    if (act === 'del' || act === 'reset') { ED.confirm = { email, kind: act }; renderEdList(); return; }
    if (act === 'no') { ED.confirm = null; renderEdList(); return; }
    if (act === 'delyes') {
      b.disabled = true;
      try { await sb.rpc('remove_editor', { addr: email }); toast(email + ' больше не редактор'); if (ED.invite && ED.invite.email === email) { ED.invite = null; renderInvite(); } }
      catch (e) { toast(edErr(e)); }
      ED.confirm = null; loadEditors(); return;
    }
    if (act === 'resetyes') {
      b.disabled = true;
      try {
        const r = await sb.rpc('reset_editor', { addr: email });
        ED.invite = { email, code: r.code, title: 'Новый код готов. Отправьте коллеге это приглашение:', note: r.deleted ? '' : 'Старый аккаунт не удалился сам. Откройте в Supabase Authentication → Users, удалите ' + email + ' и только потом отправляйте приглашение.' };
        renderInvite();
      } catch (e) { toast(edErr(e)); }
      ED.confirm = null; loadEditors(); return;
    }
  });

  /* ---------- start ---------- */
  async function startShared() {
    state.mode = 'shared';
    // Править может только доступ «Редактор» и выше: так же настроено правило базы (write: admin).
    let can = null, edit = false;
    if (user) {
      try { state.me = await user.id(); } catch (e) { }
      try { const me = await user.me(); state.myName = (me && me.name) || ''; } catch (e) { }
      try { can = await user.can('data.write'); } catch (e) { can = null; }
      try { edit = (await user.canEdit()) || (await user.isOwner()); } catch (e) { edit = false; }
    }
    state.canWrite = can === null ? edit : can;
    let gotGuides = false, gotConfig = false;
    db.collection('guides').onSnapshot(snap => {
      state.guides = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data() || {})));
      gotGuides = true; if (gotConfig) onData();
    }, () => { gotGuides = true; onData(); toast('Не получилось загрузить гайды. Обновите страницу.'); });
    db.doc('config/app').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      state.sections = d && Array.isArray(d.sections) ? clone(d.sections) : [];
      gotConfig = true; if (gotGuides) onData();
    }, () => { gotConfig = true; if (gotGuides) onData(); });
    if (state.canWrite) db.collection('access').onSnapshot(snap => {
      state.access = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data() || {})));
      onAccessData();
    }, () => { state.access = []; onAccessData(); });
  }
  async function startLocal() {
    state.mode = 'local';
    let guides = LS.get('gb.guides', null), cfg = LS.get('gb.config', null);
    if (!guides) {
      try {
        const r = await fetch('guides.json', { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.guides)) { guides = j.guides; cfg = { sections: j.sections || [] }; state.readonlySource = true; } }
      } catch (e) { }
    }
    state.canWrite = !state.readonlySource;
    state.guides = Array.isArray(guides) ? guides : [];
    state.sections = cfg && Array.isArray(cfg.sections) ? cfg.sections : [];
    const acc = LS.get('gb.access', []); state.access = Array.isArray(acc) ? acc : [];
    onData();
  }
  async function init() {
    state.route = parseToken(location.hash);
    if (window.GB_CONFIG && window.GB_CONFIG.url && window.GBSupabase) {
      $('#main').innerHTML = '<div class="page"><div class="empty"><p>Загружаю…</p></div></div>';
      return boot();
    }
    render();
    const c = window.claude;
    const inViewer = !!(c && typeof c.use === 'function');
    if (inViewer) {
      try { const res = await Promise.all([c.use('db'), c.use('user')]); db = res[0]; user = res[1]; } catch (e) { db = null; }
      c.use('downloads').then(d => { downloads = d; if (state.route.view === 'data') render(); }).catch(() => { });
      c.use('assets').then(a => { assets = a; const b = $('#imgBtn'); if (b) b.hidden = !a; if (state.route.view === 'data') fillAssetUsage(); }).catch(() => { });
    }
    if (db) startShared();
    else if (inViewer) { state.mode = 'nodb'; state.canWrite = false; onData(); }
    else startLocal();
  }
  init();
})();
</script>
</body>
</html>
